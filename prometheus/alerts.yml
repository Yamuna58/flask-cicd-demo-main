groups:
  - name: service-alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.instance }} is down"}
      - alert: HighErrorRate
        expr: sum by (service) (rate(http_requests_total{status="500"}[1m])) / sum by (service) (rate(http_requests_total[1m])) > 0.05
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} error rate above 5%"}
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[1m]))) > 0.5
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "{{ $labels.service }} p95 latency above 500ms"}
